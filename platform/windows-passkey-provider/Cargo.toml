[package]
name = "librarian-windows-passkey-provider"
description = "Windows third-party passkey provider process boundary for Librarian"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "librarian-passkey-provider"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
getrandom = "=0.4.3"
librarian-agent-protocol = { path = "../../crates/agent-protocol" }
librarian-windows-ipc = { path = "../windows-ipc" }
minicbor = { version = "=2.2.3", features = ["std"] }
sha2 = "=0.11.0"
zeroize = { version = "=1.9.0", features = ["std"] }

[build-dependencies]
cc = "=1.3.0"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
