[package]
name = "librarian-windows-passkey-agent"
description = "Agent-internal Windows WebAuthn plugin request verifier for Librarian"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[target.'cfg(windows)'.dependencies]
librarian-agent-protocol = { path = "../../crates/agent-protocol" }
zeroize = { version = "=1.9.0", features = ["std"] }

[build-dependencies]
cc = "=1.3.0"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
