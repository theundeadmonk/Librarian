[package]
name = "librarian-vault-core"
description = "Portable security-core boundary for Librarian"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = { version = "=0.5.3", features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
librarian-vault-format = { path = "../vault-format" }
p256 = { version = "=0.14.0", features = ["ecdsa"] }
sha2 = "=0.11.0"
url = "=2.5.8"
zeroize = { version = "=1.9.0", features = ["alloc"] }

[lints]
workspace = true
