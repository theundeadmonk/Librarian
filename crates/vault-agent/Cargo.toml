[package]
name = "librarian-vault-agent"
description = "Trusted local vault-agent process boundary for Librarian"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
getrandom = "=0.4.3"
librarian-agent-protocol = { path = "../agent-protocol" }
librarian-vault-core = { path = "../vault-core" }
librarian-vault-format = { path = "../vault-format" }
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "bundled", "limits", "serialize"] }
zeroize = { version = "=1.9.0", features = ["std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
same-file = "=1.0.6"

[dev-dependencies]
minicbor = { version = "=2.2.3", features = ["std"] }

[lints]
workspace = true
