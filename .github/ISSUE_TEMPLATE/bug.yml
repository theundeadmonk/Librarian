name: Bug report
description: Report reproducible incorrect behavior using disposable test data.
title: "[Bug] "
labels:
  - "kind:bug"
body:
  - type: markdown
    attributes:
      value: |
        Never include real credentials, recovery material, database files, screenshots containing secrets, or unredacted logs. Report exploitable vulnerabilities privately through GitHub Security Advisories.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the incorrect behavior and its user or security impact.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic reproduction using disposable test data.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Librarian revision, Windows build, browser and version, and installation method.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report and its attachments contain no real credentials, secrets, recovery material, or personal data.
          required: true
        - label: I have not posted exploit details for a privately reportable vulnerability.
          required: true
