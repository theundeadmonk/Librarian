name: Windows foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Windows foundation
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: >-
          rustup toolchain install
          1.97.1-x86_64-pc-windows-msvc
          --profile minimal
          --component clippy
          --component rustfmt

      - name: Install pinned Windows SDK
        shell: pwsh
        run: ./scripts/install-windows-sdk.ps1

      - name: Validate development environment
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Build, lint, and test
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Platform x64
