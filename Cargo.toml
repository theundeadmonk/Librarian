[workspace]
members = [
    "crates/agent-protocol",
    "crates/vault-agent",
    "crates/vault-core",
    "crates/vault-format",
    "platform/chromium-native-host",
    "platform/windows-hello-agent",
    "platform/windows-ipc",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/theundeadmonk/Librarian"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
