[workspace]
members = [
    "crates/agent-protocol",
    "crates/vault-agent",
    "crates/vault-core",
    "crates/vault-format",
    "platform/chromium-native-host",
    "platform/windows-hello-agent",
    "platform/windows-ipc",
    "platform/windows-passkey-agent",
    "platform/windows-passkey-provider",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/theundeadmonk/Librarian"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Runtime integration tests enforce production request deadlines around
# cryptography and durable SQLite writes. Optimize their code paths so those
# deadlines measure representative work while retaining test assertions and
# overflow checks.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
